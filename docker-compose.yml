services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: drics_app
    working_dir: /var/www

    volumes:
      - ./src:/var/www

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine

    container_name: drics_nginx

    ports:
      - "8000:80"

    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    restart: unless-stopped

  mysql:
    image: mysql:8.0

    container_name: drics_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: drics
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: drics
      MYSQL_PASSWORD: drics123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data: