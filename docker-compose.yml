services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: drics_app

    working_dir: /var/www

    volumes:
      - ./src:/var/www

    depends_on:
      - mysql


  nginx:
    image: nginx:latest

    container_name: drics_nginx

    ports:
      - "8000:80"

    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app


  mysql:
    image: mysql:8.0

    container_name: drics_mysql

    restart: always

    environment:
      MYSQL_DATABASE: drics
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: drics
      MYSQL_PASSWORD: drics123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data: